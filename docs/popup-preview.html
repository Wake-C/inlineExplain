<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>InlineExplain · Context preview</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #27382f; background: #f4f3ed; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #367359; outline-offset: 4px; }
    [hidden] { display: none !important; }
    .preview { max-width: 1200px; margin: auto; padding: 24px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 650; }
    .brand img { width: 38px; height: 38px; }
    .platform { color: #647268; font-size: 12px; letter-spacing: .6px; }
    .intro { margin: 34px 0 30px; }
    h1 { font-family: Georgia, "Songti SC", serif; font-size: 48px; font-weight: 600; line-height: 1.2; margin: 0 0 13px; }
    html[lang="en"] h1 { letter-spacing: -1.3px; }
    .intro p { margin: 0; font-size: 17px; line-height: 1.7; color: #647268; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 28px; align-items: start; }
    .step { font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; margin: 0 0 13px; }
    .step b { color: #367359; font-size: 11px; font-variant-numeric: tabular-nums; }
    .window { background: #fff; border-radius: 12px; border: 1px solid #dce1d8; overflow: hidden; }
    .chrome { display: flex; align-items: center; gap: 7px; padding: 14px 17px; background: #eef0eb; border-bottom: 1px solid #dce1d8; }
    .chrome i { width: 8px; height: 8px; border-radius: 50%; background: #bec7bd; }
    .chrome span { margin: auto; padding-right: 30px; font-size: 11px; color: #647268; }
    .article { padding: 28px 27px 22px; }
    .article .eyebrow { margin: 0 0 12px; font-size: 10px; letter-spacing: 1.6px; color: #647268; }
    .article h2 { font-family: Georgia, serif; font-size: 28px; font-weight: 400; margin: 0 0 17px; }
    .body-copy { font-family: Georgia, serif; font-size: 18px; line-height: 1.7; color: #758077; margin: 0; }
    .capture { position: relative; margin: 18px -12px; padding: 16px 12px 22px; border: 1px dashed #6f977d; border-radius: 7px; background: #f2f5ee; }
    .passage { font-family: Georgia, serif; font-size: 24px; line-height: 1.7; margin: 0; }
    #word { position: relative; border: 0; border-radius: 3px; padding: 0 3px; background: #cdddac; font: inherit; font-weight: 600; }
    .pointer { position: absolute; width: 24px; height: 28px; bottom: -23px; left: 54%; z-index: 1; }
    .context-note { margin: 15px 0 0; font-size: 12px; color: #367359; }
    .trigger { display: flex; align-items: center; gap: 12px; margin-top: 23px; font-size: 12px; color: #647268; }
    #show { display: inline-flex; gap: 7px; align-items: center; padding: 8px 12px; background: #27382f; color: #fff; border: 0; border-radius: 7px; font-size: 16px; }
    kbd { font: inherit; }
    .popup { border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 12px 28px #27382f18, 0 2px 5px #27382f0c; }
    #popup-frame { display: block; width: 100%; height: 440px; border: 0; background: #fff; }
    .apps { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; padding-top: 28px; margin-top: 28px; border-top: 1px solid #d6ddcf; font-size: 13px; }
    .apps strong { margin-right: auto; font-weight: 600; }
    .apps span { color: #647268; }
    .preview-note { font-size: 10px; color: #647268; margin: 18px 0 0; line-height: 1.6; }
    #preview-error { color: #9f3830; }
    @media (max-width: 850px) {
      .preview { padding: 26px; }
      h1 { font-size: 38px; }
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 26px; }
      .popup { max-width: 480px; }
      .apps { gap: 14px; }
      .apps strong { flex-basis: 100%; }
    }
    @media (max-width: 420px) {
      .preview { padding: 22px 18px; }
      .platform { display: none; }
      h1 { font-size: 32px; }
      .intro p { font-size: 15px; }
      .article { padding: 22px; }
      .passage { font-size: 22px; }
      .trigger { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="workspace">
      <section aria-label="Source text illustration">
        <p class="step"><b>01</b><span data-copy="sourceStep">取词，也读附近的句子</span></p>
        <article class="window">
          <div class="chrome"><i></i><i></i><i></i><span data-copy="window">正在阅读的应用</span></div>
          <div class="article" lang="en">
            <p class="eyebrow">FIELD NOTES / 04</p><h2>A walk by the river</h2>
            <p class="body-copy">The trail followed the water through a quiet stretch of woodland.</p>
            <div class="capture"><p class="passage">She sat on the <button id="word" type="button" aria-label="Explain bank">bank<svg class="pointer" viewBox="0 0 24 28" aria-hidden="true"><path d="M3 2 4 23l6-5 5 8 4-2-5-8 8-1Z" fill="#27382f" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></button> of the river and watched the water.</p><p class="context-note" data-copy="capture">鼠标下的单词 + 屏幕上可见的上下文</p></div>
            <p class="body-copy">A few leaves drifted past in the afternoon light.</p>
            <div class="trigger"><button id="show" type="button" aria-label="Show explanation"><kbd>⌥</kbd><kbd>S</kbd></button><span data-copy="shortcut">无需选中，也不用复制粘贴</span></div>
          </div>
        </article>
      </section>
      <section aria-label="Contextual explanation">
        <p class="step"><b>02</b><span data-copy="answerStep">解释这个词在这句话里的意思</span></p>
        <aside id="popup" class="popup"><iframe id="popup-frame" title="InlineExplain reading card"></iframe></aside>
      </section>
    </div>
    <p id="preview-error" hidden></p>
  </main>
  <script>
    const language = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
    if (language === 'en') {
      document.documentElement.lang = 'en';
      const copy = {title:'The word. The sentence. The meaning.',intro:'Point at an English word in any app. Press ⌥ S to understand it in place.',sourceStep:'Capture the word and nearby text',window:'The app you’re reading in',capture:'Word under the pointer + visible context',shortcut:'No selecting. No copying and pasting.',answerStep:'Get the meaning that fits this sentence',anywhere:'Wherever you read',web:'Web pages',subtitles:'Visible subtitles',documents:'Documents',apps:'Other apps',note:'Illustration · Real card renderer, sample explanation · Green marks explain capture scope; they are not app overlays'};
      document.querySelectorAll('[data-copy]').forEach(node => { node.textContent = copy[node.dataset.copy]; });
    }
    const popup = document.querySelector('#popup');
    const frame = document.querySelector('#popup-frame');
    const show = () => { popup.hidden = false; };
    const hide = () => { popup.hidden = true; };
    const keydown = event => {
      if (event.key === 'Escape') hide();
      if (event.altKey && event.code === 'KeyS') { event.preventDefault(); show(); }
    };
    window.InlineExplainPreview = {language, hide, keydown,
      resize(height) { frame.style.height = Math.min(680, Math.max(150, height)) + 'px'; },
      ready() { document.documentElement.dataset.previewReady = 'true'; }
    };
    document.querySelector('#word').addEventListener('click', show);
    document.querySelector('#show').addEventListener('click', show);
    document.addEventListener('keydown', keydown);
    document.addEventListener('pointerdown', event => { if (!event.target.closest('#word, #show, #popup')) hide(); });
    (async () => {
      const response = await fetch('../frontend/index.html');
      if (!response.ok) throw new Error('Could not load the card renderer.');
      const frontend = await response.text();
      const base = new URL('../frontend/', location.href).href;
      const bridge = new URL('assets/popup-bridge.js', location.href).href;
      frame.srcdoc = frontend.replace('<head>', '<head><base href="' + base + '"><script src="' + bridge + '"><\/script>');
    })().catch(error => { document.querySelector('#preview-error').hidden = false; document.querySelector('#preview-error').textContent = error.message; });
  </script>
</body>
</html>
